<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Performansi Panitia</title>
  <meta name="description" content="Alat bantu panitia untuk mengatur waktu penampilan dengan sinyal visual Hijau, Kuning, dan Merah.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-primary-light: #eef2ff;
      --color-accent: #06b6d4;
      --color-danger: #ef4444;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.dark {
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --border-color: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --color-primary: #6366f1;
      --color-primary-hover: #4f46e5;
      --color-primary-light: #1e1b4b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .theme-toggle {
      background: none;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      color: var(--text-main);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 2rem;
    }

    .timer-display {
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text-main);
      transition: color 0.3s ease;
    }

    .timer-display.warning {
      color: var(--color-warning);
    }

    .timer-display.danger {
      color: var(--color-danger);
      animation: pulse-text 1s infinite;
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .traffic-light {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: var(--bg-surface);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .light {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--bg-surface-elevated);
      border: 3px solid var(--border-color);
      transition: var(--transition);
    }

    .light.green {
      background-color: #86efac;
      border-color: #22c55e;
    }

    .light.yellow {
      background-color: #fde047;
      border-color: #eab308;
    }

    .light.red {
      background-color: #fca5a5;
      border-color: #ef4444;
    }

    html.dark .light.green {
      background-color: #14532d;
      border-color: #22c55e;
    }

    html.dark .light.yellow {
      background-color: #713f12;
      border-color: #eab308;
    }

    html.dark .light.red {
      background-color: #7f1d1d;
      border-color: #ef4444;
    }

    .light.active {
      transform: scale(1.1);
      box-shadow: 0 0 30px currentColor;
    }

    .light.green.active {
      box-shadow: 0 0 40px #22c55e;
    }

    .light.yellow.active {
      box-shadow: 0 0 40px #eab308;
      animation: pulse-yellow 1s infinite;
    }

    .light.red.active {
      box-shadow: 0 0 40px #ef4444;
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 40px #ef4444; }
      50% { box-shadow: 0 0 80px #ef4444; }
    }

    @keyframes pulse-yellow {
      0%, 100% { box-shadow: 0 0 40px #eab308; }
      50% { box-shadow: 0 0 80px #eab308; }
    }

    .status-text {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      min-height: 2rem;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .status-text.warning {
      color: var(--color-warning);
    }

    .status-text.danger {
      color: var(--color-danger);
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      min-width: 120px;
    }

    .btn:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-danger {
      background-color: var(--color-danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .btn-secondary {
      background-color: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .settings {
      background-color: var(--bg-surface);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .settings h2 {
      font-size: 1.125rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input {
      padding: 0.625rem 0.875rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .form-group input:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-surface);
      color: var(--text-main);
      padding: 0.875rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 0.9375rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      border-left: 4px solid var(--color-success);
    }

    .toast-error {
      border-left: 4px solid var(--color-danger);
    }

    .toast-info {
      border-left: 4px solid var(--color-accent);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem;
      }
      main {
        padding: 1.5rem 1rem;
        gap: 1.5rem;
      }
      .light {
        width: 64px;
        height: 64px;
      }
      .btn {
        min-width: 100px;
        padding: 0.625rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Timer Performansi Panitia</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">Mode Gelap</button>
  </header>

  <main id="app">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="traffic-light" id="trafficLight" aria-label="Sinyal lampu">
      <div class="light green" id="lightGreen" aria-label="Sinyal hijau"></div>
      <div class="light yellow" id="lightYellow" aria-label="Sinyal kuning"></div>
      <div class="light red" id="lightRed" aria-label="Sinyal merah"></div>
    </div>
    <div class="status-text" id="statusText" aria-live="polite">Siap memulai</div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Mulai</button>
      <button class="btn btn-danger" id="stopBtn" disabled>Berhenti</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>
    <div class="settings" id="settings">
      <h2>Pengaturan</h2>
      <div class="form-group">
        <label for="durationInput">Durasi Maksimum (menit)</label>
        <input type="number" id="durationInput" min="1" max="60" value="7">
      </div>
      <div class="form-group">
        <label for="warningInput">Peringatan Kuning (menit)</label>
        <input type="number" id="warningInput" min="0" max="59" value="6.5" step="0.5">
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <footer>
    <p>&copy; <span id="year"></span> Timer Performansi Panitia. Dibuat dengan Vanilla HTML, CSS, dan JavaScript.</p>
  </footer>

  <script>
    'use strict';

    const App = {
      state: {
        theme: localStorage.getItem('app_theme') || 'light',
        isRunning: false,
        elapsed: 0,
        durationMinutes: 7,
        warningMinutes: 6.5,
        intervalId: null,
        lastPhase: null,
        audioCtx: null
      },

      dom: {},

      init() {
        this.cacheDOM();
        this.loadState();
        this.applyTheme();
        this.updateSettingsUI();
        this.render();
        this.bindEvents();
      },

      cacheDOM() {
        this.dom.html = document.documentElement;
        this.dom.timerDisplay = document.getElementById('timerDisplay');
        this.dom.lightGreen = document.getElementById('lightGreen');
        this.dom.lightYellow = document.getElementById('lightYellow');
        this.dom.lightRed = document.getElementById('lightRed');
        this.dom.statusText = document.getElementById('statusText');
        this.dom.startBtn = document.getElementById('startBtn');
        this.dom.stopBtn = document.getElementById('stopBtn');
        this.dom.resetBtn = document.getElementById('resetBtn');
        this.dom.themeToggle = document.getElementById('themeToggle');
        this.dom.durationInput = document.getElementById('durationInput');
        this.dom.warningInput = document.getElementById('warningInput');
        this.dom.toastContainer = document.getElementById('toastContainer');
        this.dom.yearSpan = document.getElementById('year');
        if (this.dom.yearSpan) this.dom.yearSpan.textContent = new Date().getFullYear();
      },

      loadState() {
        try {
          const raw = localStorage.getItem('timer_performansi_panitia_data');
          if (raw) {
            const data = JSON.parse(raw);
            if (data.durationMinutes) this.state.durationMinutes = data.durationMinutes;
            if (data.warningMinutes) this.state.warningMinutes = data.warningMinutes;
          }
        } catch (e) {
          console.error('Failed to load state:', e);
        }
      },

      saveState() {
        try {
          localStorage.setItem('timer_performansi_panitia_data', JSON.stringify({
            durationMinutes: this.state.durationMinutes,
            warningMinutes: this.state.warningMinutes
          }));
        } catch (e) {
          console.error('Failed to save state:', e);
          this.showToast('Gagal menyimpan pengaturan!', 'error');
        }
      },

      applyTheme() {
        if (this.state.theme === 'dark') {
          this.dom.html.classList.add('dark');
          this.dom.themeToggle.textContent = 'Mode Terang';
        } else {
          this.dom.html.classList.remove('dark');
          this.dom.themeToggle.textContent = 'Mode Gelap';
        }
        localStorage.setItem('app_theme', this.state.theme);
      },

      toggleTheme() {
        this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
        this.applyTheme();
      },

      formatTime(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = Math.floor(totalSeconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      },

      playBeep() {
        try {
          if (!this.state.audioCtx) {
            this.state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.state.audioCtx.state === 'suspended') {
            this.state.audioCtx.resume();
          }
          const osc = this.state.audioCtx.createOscillator();
          const gain = this.state.audioCtx.createGain();
          osc.connect(gain);
          gain.connect(this.state.audioCtx.destination);
          osc.frequency.value = 800;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, this.state.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.state.audioCtx.currentTime + 0.4);
          osc.start(this.state.audioCtx.currentTime);
          osc.stop(this.state.audioCtx.currentTime + 0.4);
        } catch (e) {
          console.error('Audio not supported:', e);
        }
      },

      updateLights(elapsed) {
        const warningSec = this.state.warningMinutes * 60;
        const durationSec = this.state.durationMinutes * 60;
        let phase = 'green';

        if (elapsed >= durationSec) {
          phase = 'red';
        } else if (elapsed >= warningSec) {
          phase = 'yellow';
        } else {
          phase = 'green';
        }

        this.dom.lightGreen.classList.toggle('active', phase === 'green');
        this.dom.lightYellow.classList.toggle('active', phase === 'yellow');
        this.dom.lightRed.classList.toggle('active', phase === 'red');

        if (phase !== this.state.lastPhase && this.state.isRunning) {
          if (phase === 'yellow') {
            this.playBeep();
            this.showToast('Sisa 30 detik!', 'warning');
          } else if (phase === 'red') {
            this.playBeep();
            this.playBeep();
            this.showToast('Waktu habis!', 'error');
          }
          this.state.lastPhase = phase;
        }

        return phase;
      },

      start() {
        if (this.state.isRunning) return;
        this.state.isRunning = true;
        this.dom.startBtn.disabled = true;
        this.dom.stopBtn.disabled = false;
        this.showToast('Penampilan dimulai', 'success');

        this.state.intervalId = setInterval(() => {
          this.state.elapsed += 0.1;
          this.render();
        }, 100);
      },

      stop() {
        if (!this.state.isRunning) return;
        this.state.isRunning = false;
        clearInterval(this.state.intervalId);
        this.dom.startBtn.disabled = false;
        this.dom.stopBtn.disabled = true;
        this.showToast('Penampilan dihentikan', 'info');
      },

      reset() {
        this.stop();
        this.state.elapsed = 0;
        this.state.lastPhase = 'green';
        this.render();
        this.showToast('Timer direset', 'info');
      },

      updateSettings() {
        const dur = parseFloat(this.dom.durationInput.value);
        const warn = parseFloat(this.dom.warningInput.value);

        if (isNaN(dur) || dur < 1 || dur > 60) {
          this.showToast('Durasi harus antara 1-60 menit', 'error');
          return;
        }
        if (isNaN(warn) || warn < 0 || warn >= dur) {
          this.showToast('Peringatan harus lebih kecil dari durasi', 'error');
          return;
        }

        this.state.durationMinutes = dur;
        this.state.warningMinutes = warn;
        this.saveState();
        this.render();
        this.showToast('Pengaturan disimpan', 'success');
      },

      updateSettingsUI() {
        this.dom.durationInput.value = this.state.durationMinutes;
        this.dom.warningInput.value = this.state.warningMinutes;
      },

      render() {
        const elapsed = this.state.elapsed;
        const display = this.formatTime(elapsed);
        this.dom.timerDisplay.textContent = display;

        const warningSec = this.state.warningMinutes * 60;
        const durationSec = this.state.durationMinutes * 60;

        this.dom.timerDisplay.classList.remove('warning', 'danger');
        this.dom.statusText.classList.remove('warning', 'danger');

        this.updateLights(elapsed);

        if (elapsed >= durationSec) {
          this.dom.timerDisplay.classList.add('danger');
          this.dom.statusText.classList.add('danger');
          this.dom.statusText.textContent = 'Waktu habis! Hentikan penampilan.';
        } else if (elapsed >= warningSec) {
          this.dom.timerDisplay.classList.add('warning');
          this.dom.statusText.classList.add('warning');
          const remaining = durationSec - elapsed;
          this.dom.statusText.textContent = 'Sisa ' + this.formatTime(remaining) + ' — peringatan!';
        } else {
          this.dom.statusText.textContent = 'Penampilan berlangsung...';
        }
      },

      showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        this.dom.toastContainer.appendChild(toast);
        requestAnimationFrame(() => {
          toast.classList.add('show');
        });
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      },

      bindEvents() {
        this.dom.startBtn.addEventListener('click', () => this.start());
        this.dom.stopBtn.addEventListener('click', () => this.stop());
        this.dom.resetBtn.addEventListener('click', () => this.reset());
        this.dom.themeToggle.addEventListener('click', () => this.toggleTheme());
        this.dom.durationInput.addEventListener('change', () => this.updateSettings());
        this.dom.warningInput.addEventListener('change', () => this.updateSettings());
      }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
